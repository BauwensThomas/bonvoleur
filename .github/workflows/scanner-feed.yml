name: Scanner BonVoleur (vers Supabase)

# Le scanner tourne sur GitHub Actions et ecrit les deals DIRECTEMENT dans
# Supabase (table deals), sans aucun JSON. Le site lit ensuite Supabase.
# Apres le scan, ce workflow declenche aussi les agents qui DEPENDENT du scan :
# generate-routes (fiches SEO) a chaque run, et les digests (deal-sender) APRES
# le scan du soir -> ils tournent toujours APRES le scan, jamais a heure fixe.
#
# Heures en UTC : 01:07, 08:07, 15:07 UTC ~= 03:07, 10:07, 17:07 Bruxelles (ete).
# Minute decalee (07 au lieu de 00/30) : les minutes rondes sont les plus
# demandees sur GitHub Actions -> plus de retard aux heures de pointe. Premier
# scan tot le matin pour capter les bons plans qui apparaissent la nuit.
# NB : GitHub ne garantit pas l'heure exacte des workflows planifies (retard
# possible en cas de forte charge, documente officiellement) - necessite le
# secret GitHub CRON_SECRET (Settings > Secrets > Actions).

on:
  schedule:
    - cron: "7 1 * * *"
    - cron: "7 8 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      BONVOLEUR_URL: https://www.bonvoleur.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Vérifie le mode maintenance
        id: maintenance
        run: |
          if ! RESPONSE=$(curl -fsS "$BONVOLEUR_URL/api/maintenance/status"); then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Statut de maintenance inaccessible : workflow suspendu par sécurité."
          else
            ACTIVE=$(echo "$RESPONSE" | python -c 'import json, sys; print(str(json.load(sys.stdin)["active"]).lower())')
            echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
            echo "Maintenance active: $ACTIVE"
          fi
      - name: Scan + ecriture dans Supabase
        if: steps.maintenance.outputs.active != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: python scripts/scanner.py --supabase

      # Genere la fiche (contenu + photo) des destinations PAS ENCORE en base.
      # Saute les destinations connues -> aucun token gaspille.
      - uses: actions/setup-node@v4
        if: steps.maintenance.outputs.active != 'true'
        with:
          node-version: "24"
      # npm install (tolerant) plutot que npm ci : evite l'echec lie aux binaires
      # optionnels par plateforme (sharp, dependance optionnelle de Next).
      - run: npm install --no-audit --no-fund
        if: steps.maintenance.outputs.active != 'true'
      - name: Fiches auto des nouvelles destinations
        if: steps.maintenance.outputs.active != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/generate-routes.mjs

      # APRES chaque scan (3x/jour) : on declenche les digests SANS sharding.
      # C'est le PLAFOND par periode qui regle la frequence (premium = 24h,
      # gratuit = 7j) : un abonne n'est servi qu'une fois passe son delai. Lancer
      # apres CHAQUE scan garantit qu'aucun jour n'est saute -> si un scan tombe
      # "trop tot" (< plafond depuis le dernier envoi), le scan suivant rattrape.
      # github.event.schedule = la cron qui a declenche ('' en manuel -> saute).
      - name: Digests (apres chaque scan, plafond = frequence)
        if: ${{ success() && steps.maintenance.outputs.active != 'true' && github.event.schedule != '' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE="https://www.bonvoleur.com/api/cron"
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$BASE/digest-daily"
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$BASE/digest-weekly"

name: Scanner BonVoleur (vers Supabase)

# Le scanner tourne sur GitHub Actions et ecrit les deals DIRECTEMENT dans
# Supabase (table deals), sans aucun JSON. Le site lit ensuite Supabase.
# Apres le scan, ce workflow declenche aussi les agents qui DEPENDENT du scan :
# generate-routes (fiches SEO) a chaque run, et les digests (deal-sender) APRES
# le scan du soir -> ils tournent toujours APRES le scan, jamais a heure fixe.
#
# Heures en UTC : 05:30, 11:30, 17:30 UTC ~= 07:30, 13:30, 19:30 Bruxelles (ete).
# NB : necessite le secret GitHub CRON_SECRET (Settings > Secrets > Actions).

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Scan + ecriture dans Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: python scripts/scanner.py --supabase

      # Genere la fiche (contenu + photo) des destinations PAS ENCORE en base.
      # Saute les destinations connues -> aucun token gaspille.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # npm install (tolerant) plutot que npm ci : evite l'echec lie aux binaires
      # optionnels par plateforme (sharp, dependance optionnelle de Next).
      - run: npm install --no-audit --no-fund
      - name: Fiches auto des nouvelles destinations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/generate-routes.mjs

      # APRES chaque scan : declenche les digests pour le CRENEAU de ce scan.
      # Le slot (0/1/2 selon le scan matin/midi/soir) repartit les abonnes sur
      # les 3 scans -> charge etalee. Chaque premium recoit 1x/jour (a son scan) ;
      # chaque gratuit 1x/semaine (le jour de son inscription, a son scan).
      # github.event.schedule = la cron qui a declenche ('' en manuel -> saute).
      - name: Digests (repartis par creneau, apres le scan)
        if: ${{ success() && github.event.schedule != '' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHED: ${{ github.event.schedule }}
        run: |
          case "$SCHED" in
            "30 5 * * *") SLOT=0 ;;
            "30 11 * * *") SLOT=1 ;;
            "30 17 * * *") SLOT=2 ;;
            *) echo "Scan hors planning, pas de digest."; exit 0 ;;
          esac
          BASE="https://www.bonvoleur.com/api/cron"
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$BASE/digest-daily?slot=$SLOT&scans=3"
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$BASE/digest-weekly?slot=$SLOT&scans=3"

name: Scanner BonVoleur (vers Supabase)

# Le scanner tourne sur GitHub Actions et ecrit les deals DIRECTEMENT dans
# Supabase (table deals), sans aucun JSON. Le site lit ensuite Supabase.
# Apres le scan, ce workflow declenche aussi les agents qui DEPENDENT du scan :
# generate-routes (fiches SEO) a chaque run, et les digests (deal-sender) APRES
# le scan du soir -> ils tournent toujours APRES le scan, jamais a heure fixe.
#
# Heures en UTC : 05:30, 11:30, 17:30 UTC ~= 07:30, 13:30, 19:30 Bruxelles (ete).
# NB : necessite le secret GitHub CRON_SECRET (Settings > Secrets > Actions).

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Scan + ecriture dans Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: python scripts/scanner.py --supabase

      # Genere la fiche (contenu + photo) des destinations PAS ENCORE en base.
      # Saute les destinations connues -> aucun token gaspille.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # npm install (tolerant) plutot que npm ci : evite l'echec lie aux binaires
      # optionnels par plateforme (sharp, dependance optionnelle de Next).
      - run: npm install --no-audit --no-fund
      - name: Fiches auto des nouvelles destinations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/generate-routes.mjs

      # APRES le scan du SOIR uniquement (1x/jour) : digest premium quotidien,
      # avec les deals frais qui viennent d'etre scannes. github.event.schedule
      # vaut la cron qui a declenche le run ('' en declenchement manuel -> saute).
      - name: Digest premium (quotidien, apres le scan du soir)
        if: ${{ success() && github.event.schedule == '30 17 * * *' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://www.bonvoleur.com/api/cron/digest-daily

      # Le VENDREDI soir seulement (1x/semaine) : digest gratuit hebdomadaire.
      - name: Digest gratuit (hebdo, vendredi soir)
        if: ${{ success() && github.event.schedule == '30 17 * * *' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ "$(date -u +%u)" = "5" ]; then
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://www.bonvoleur.com/api/cron/digest-weekly
          else
            echo "Pas vendredi : digest hebdo non envoye."
          fi
